/**
 * hotxposed库模块构建配置
 * 适配AGP 8.10.0变更：
 * - compileSdkVersion → compileSdk
 * - minSdkVersion/targetSdkVersion → minSdk/targetSdk
 * - lintOptions → lint
 * - 新增namespace声明（AGP 8.x必须）
 * - 升级compileSdk和buildToolsVersion
 */
apply plugin: 'com.android.library'

android {
    // AGP 8.x要求必须声明namespace，替代AndroidManifest.xml中的package属性
    namespace 'net.androidwing.hotxposed'
    // 升级compileSdk到34，AGP 8.x要求更高版本
    compileSdk 34

    defaultConfig {
        // AGP 8.x新语法：minSdk替代minSdkVersion
        minSdk 14
        // AGP 8.x新语法：targetSdk替代targetSdkVersion
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // AGP 8.x中lintOptions已废弃，使用lint替代
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.appcompat:appcompat:1.2.0'
}
